<svg width="400" height="160" viewBox="0 0 400 160" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap');
        text { font-family: 'Inter', sans-serif; }
    </style>
    
    <filter id="topMetricShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.04"/>
    </filter>
</defs>

<!-- CANVAS BACKGROUND -->
<rect width="400" height="160" fill="#E2E8F0"/>

<!-- ============================================== -->
<!-- TOP METRICS (MiERP PURPLE THEME)               -->
<!-- ============================================== -->

<!-- Metric 1: Total Products -->
<rect x="28" y="36" width="166" height="88" rx="16" fill="#FFFFFF" filter="url(#topMetricShadow)"/>
<rect x="28" y="36" width="166" height="88" rx="16" fill="none" stroke="#F1F5F9" stroke-width="1.5"/>

<!-- Icon Box: MiERP Violet 100 Background, Violet 200 Border -->
<rect x="44" y="52" width="28" height="28" rx="8" fill="#F3E8FF" stroke="#E9D5FF" stroke-width="1"/>
<!-- Icon Glyph: MiERP Purple (#7C3AED) -->
<g transform="translate(47.8, 55.8) scale(0.85)" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
    <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
    <line x1="12" y1="22.08" x2="12" y2="12"/>
</g>

<!-- Approved Typography -->
<text x="88" y="74" fill="#334155" font-size="22" font-weight="600" letter-spacing="-0.5">1,240</text>
<text x="44" y="108" fill="#64748B" font-size="12" font-weight="600">Total Products</text>


<!-- Metric 2: Total Quantity -->
<rect x="206" y="36" width="166" height="88" rx="16" fill="#FFFFFF" filter="url(#topMetricShadow)"/>
<rect x="206" y="36" width="166" height="88" rx="16" fill="none" stroke="#F1F5F9" stroke-width="1.5"/>

<!-- Icon Box: MiERP Violet 100 Background, Violet 200 Border -->
<rect x="222" y="52" width="28" height="28" rx="8" fill="#F3E8FF" stroke="#E9D5FF" stroke-width="1"/>
<!-- Icon Glyph: MiERP Purple (#7C3AED) -->
<g transform="translate(225.8, 55.8) scale(0.85)" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polygon points="12 2 2 7 12 12 22 7 12 2"/>
    <polyline points="2 17 12 22 22 17"/>
    <polyline points="2 12 12 17 22 12"/>
</g>

<!-- Approved Typography -->
<text x="266" y="74" fill="#334155" font-size="22" font-weight="600" letter-spacing="-0.5">14.5K</text>
<text x="222" y="108" fill="#64748B" font-size="12" font-weight="600">Total Quantity</text>

</svg>
