<svg width="400" height="180" viewBox="0 0 400 180" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap');
        text { font-family: 'Inter', sans-serif; }
    </style>
    <clipPath id="avatarClip">
        <circle cx="56" cy="80" r="24"/>
    </clipPath>
    
    <!-- Premium Blue to MiERP Purple Gradient -->
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#3B82F6" /> <!-- Vibrant Blue -->
        <stop offset="100%" stop-color="#6D28D9" /> <!-- Deep MiERP Purple -->
    </linearGradient>
</defs>

<!-- CANVAS BACKGROUND -->
<rect width="400" height="180" fill="#E2E8F0"/>

<!-- ============================================== -->
<!-- MOBILE APP HEADER (BLUE-PURPLE GRADIENT)       -->
<!-- ============================================== -->

<!-- Main Header Shape with Bottom-Left Curve (rx=60) -->
<path d="M0 0 H 400 V 160 H 60 A 60 60 0 0 1 0 100 Z" fill="url(#headerGradient)"/>

<!-- Subtle Decorative Background Elements (Flat, NO Gradients) -->
<circle cx="340" cy="10" r="100" fill="#FFFFFF" fill-opacity="0.06"/>
<circle cx="40" cy="150" r="60" fill="#FFFFFF" fill-opacity="0.06"/>

<!-- User Avatar -->
<circle cx="56" cy="80" r="24" fill="#E9D5FF"/>
<g clip-path="url(#avatarClip)">
    <!-- Flat Placeholder Avatar Body/Head -->
    <circle cx="56" cy="74" r="10" fill="#7C3AED" fill-opacity="0.5"/>
    <circle cx="56" cy="104" r="18" fill="#7C3AED" fill-opacity="0.5"/>
</g>

<!-- Greeting & User Name -->
<text x="96" y="74" fill="#E0E7FF" font-size="13" font-weight="500">Good Morning,</text>
<text x="96" y="96" fill="#FFFFFF" font-size="20" font-weight="700" letter-spacing="-0.5">Tuan Oksar</text>

<!-- Notification Button (Right Aligned) -->
<!-- Button Background -->
<rect x="332" y="60" width="40" height="40" rx="12" fill="#FFFFFF" fill-opacity="0.15"/>

<!-- Bell Icon (Mathematically Centered: Box cx=352, cy=80) -->
<g transform="translate(341.2, 69.2) scale(0.9)" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
    
    <!-- Red Notification Dot -->
    <circle cx="17" cy="5" r="4" fill="#EF4444" stroke="#4F46E5" stroke-width="1.5"/>
</g>

</svg>
